name: Build Olympus XYZ

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :src:es:olympusscanlation:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: olympusxyz-apk
          path: src/es/olympusscanlation/build/outputs/apk/**/*.apk
          if-no-files-found: warn
